<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505">
  <title>JobFit — Sign in</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="space-field" aria-hidden="true"><i class="orb orb-one"></i><i class="orb orb-two"></i><i class="wire-cube"></i></div>
  <main class="auth-card">
    <a class="brand" href="/login"><b>J</b><span>JOBFIT</span></a>
    <p class="kicker">CAREER INTELLIGENCE / LIVE SIGNALS</p>
    <h1>Build a career<br><em>with evidence.</em></h1>
    <p>Live IT opportunities, role analysis, verified company criteria, and a focused next step—built around your profile.</p>
    <button id="google-login" class="google-button" type="button"><span>G</span> Continue with Google</button>
    <button id="dev-login" class="text-button" type="button" hidden>Use local development session</button>
    <p id="login-message" class="auth-message" role="alert"></p>
    <small>Google authentication is used only to create your JobFit session.</small>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
